name: AI Website Automation Scheduler

on:
  schedule:
    # Runs once every hour, at minute 0
    - cron: "0 * * * *"
  workflow_dispatch: {}

concurrency:
  group: ai-website-automation
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  run-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    environment:
      name: github-pages

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: npm install
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Automation
        id: automation
        env:
          UXPILOT_SHARED_PASSWORD: ${{ secrets.UXPILOT_SHARED_PASSWORD }}
          UX_EMAIL: ${{ secrets.UX_EMAIL }}
          UX_PASSWORD: ${{ secrets.UX_PASSWORD }}
          ELEMENTOR_SHARED_PASSWORD: ${{ secrets.ELEMENTOR_SHARED_PASSWORD }}
          ELEMENTOR_PASSWORD: ${{ secrets.ELEMENTOR_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          FIGMA_URL: ${{ secrets.FIGMA_URL }}
          ELEMENTOR_URL: ${{ secrets.ELEMENTOR_URL }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_TEMPERATURE: ${{ secrets.AI_TEMPERATURE }}
          AI_MAX_OUTPUT_TOKENS: ${{ secrets.AI_MAX_OUTPUT_TOKENS }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: npm run build && npm start

      - name: Upload Generated Website to GitHub Pages
        if: always()
        uses: actions/upload-pages-artifact@v4
        with:
          path: downloads/

      - name: Deploy Generated Website to GitHub Pages
        id: deployment
        if: always()
        uses: actions/deploy-pages@v4

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ github.run_id }}
          path: logs/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Screenshots (only on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ github.run_id }}
          path: screenshots/
          retention-days: 14
          if-no-files-found: ignore
